# Netlify build settings (used by the private family deployment).
# Supabase URL and key are set as environment variables in the Netlify UI.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Keep the family site out of search engines.
    X-Robots-Tag = "noindex, nofollow"
